{{define "content"}}
<div class="panel auth">
  <h1>Change password</h1>
  {{if .User.MustChangePassword}}
  <p class="muted">You signed in with a temporary password. Choose your own to continue.</p>
  {{end}}
  <form method="post" action="/account/password" class="stack">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="new" autocomplete="new-password" minlength="10" maxlength="72" required></label>
    <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" minlength="10" maxlength="72" required></label>
    <p class="hint">10 to 72 characters.</p>
    <button type="submit" class="primary">Change password</button>
  </form>
</div>
{{end}}
